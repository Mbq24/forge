name: Gold Hours
description: XAUUSD session-based trading during London/NY hours
timeframe: 1h
indicators:
- id: ema_5
  type: ema
  params:
    period: 5
- id: ema_8
  type: ema
  params:
    period: 8
- id: ema_13
  type: ema
  params:
    period: 13
- id: rsi
  type: rsi
  params:
    period: 14
compounds:
- id: alignment
  type: ema_alignment
  params:
    emas:
    - ema_5
    - ema_8
    - ema_13
- id: pull
  type: pull_count
  params:
    ema: ema_5
patterns:
- doji
signals:
  entry: CROSSOVER(ema_5, ema_13) AND NOT session_slow > 0
  exit: session_slow OR pull >= 3
