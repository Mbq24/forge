name: SPX Advisor
description: "LLM-suggested indicator for SPX (1h) \u2014 \U0001F30A Ranging market\
  \ (RSI \u2248 50)"
timeframe: 1d
indicators:
- id: ema_5
  type: ema
  params:
    period: 5
- id: ema_8
  type: ema
  params:
    period: 8
- id: ema_13
  type: ema
  params:
    period: 13
- id: rsi
  type: rsi
  params:
    period: 14
- id: atr
  type: atr
  params:
    period: 14
compounds:
- id: alignment
  type: ema_alignment
  params:
    emas:
    - ema_5
    - ema_8
    - ema_13
- id: spread
  type: ema_spread
  params:
    emas:
    - ema_5
    - ema_8
    - ema_13
- id: pull
  type: pull_count
  params:
    ema: ema_5
- id: proximity
  type: candle_proximity
  params:
    ema: ema_5
patterns:
- doji
- hammer
signals:
  entry: rsi < 30 AND hammer > 0
  exit: rsi > 70 OR pull >= 3
