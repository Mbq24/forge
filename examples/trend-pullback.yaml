# Trend Pullback — Enter pullbacks in a trending market
#
# In a bull trend (bullish EMA alignment), wait for price to
# pull back toward the 5 EMA. Entry triggers when proximity
# is close and a hammer pattern appears (buying pressure).

name: "Trend Pullback"
description: "Enter pullbacks in trending markets using EMA proximity + candle confirmation"
timeframe: "1h"

indicators:
  - id: ema_5
    type: ema
    params: { period: 5 }
  - id: ema_8
    type: ema
    params: { period: 8 }
  - id: ema_13
    type: ema
    params: { period: 13 }
  - id: rsi
    type: rsi
    params: { period: 14 }

compounds:
  - id: alignment
    type: ema_alignment
    params: { emas: [ema_5, ema_8, ema_13] }
  - id: proximity
    type: candle_proximity
    params: { ema: ema_5 }
  - id: pull
    type: pull_count
    params: { ema: ema_5 }

patterns:
  - hammer
  - bullish_engulfing

signals:
  entry: "alignment == 1 AND proximity < -1 AND (hammer OR bullish_engulfing)"
  exit: "pull >= 3 OR rsi > 70"
