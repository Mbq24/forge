name: RSI-EMA-Simple1
description: RSI mean reversion with EMA trend filter and BB squeeze
timeframe: 1h
indicators:
- id: ema_short
  type: ema
  params:
    period: 20
- id: ema_long
  type: ema
  params:
    period: 200
- id: rsi
  type: rsi
  params:
    period: 14
compounds:
- id: proximity
  type: candle_proximity
  params:
    ema: ema_short
patterns:
- doji
- hammer
signals:
  entry: rsi < 30 AND close > ema_long AND NOT doji
  exit: rsi > 70 OR (close < ema_short AND proximity < -2)
