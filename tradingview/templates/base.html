<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DockerTVWebhook{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b1120;
      --bg-card: #0f172a;
      --bg-code: #020617;
      --border: #1e293b;
      --text: #e2e8f0;
      --text-dim: #64748b;
      --cyan: #22d3ee;
      --emerald: #34d399;
      --violet: #a78bfa;
      --rose: #fb7185;
      --amber: #fbbf24;
    }
    body { background: var(--bg-dark); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
    .navbar { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0.75rem 1rem; }
    .navbar-brand { color: var(--cyan) !important; font-weight: 600; font-size: 1.1rem; }
    .navbar .nav-link { color: var(--text-dim) !important; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 4px; }
    .navbar .nav-link:hover, .navbar .nav-link.active { color: var(--text) !important; background: rgba(34,211,238,0.08); }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; }
    .card-header { background: transparent; border-bottom: 1px solid var(--border); padding: 0.75rem 1rem; font-size: 0.85rem; font-weight: 600; color: var(--text); }
    pre.code-block {
      background: var(--bg-code); border: 1px solid var(--border); border-radius: 6px;
      padding: 1rem; font-size: 0.78rem; line-height: 1.6; overflow-x: auto; color: var(--text-dim);
      max-height: 500px;
    }
    pre.code-block .cm { color: #475569; font-style: italic; }
    pre.code-block .kw { color: var(--rose); }
    pre.code-block .str { color: var(--violet); }
    pre.code-block .num { color: var(--emerald); }
    pre.code-block .key { color: var(--cyan); }
    pre.code-block .fn { color: var(--amber); }
    .tag {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 0.7rem; font-weight: 500; margin-right: 4px;
    }
    .tag-cyan { background: rgba(34,211,238,0.1); color: var(--cyan); border: 1px solid rgba(34,211,238,0.3); }
    .tag-emerald { background: rgba(52,211,153,0.1); color: var(--emerald); border: 1px solid rgba(52,211,153,0.3); }
    .tag-violet { background: rgba(167,139,250,0.1); color: var(--violet); border: 1px solid rgba(167,139,250,0.3); }
    .tag-rose { background: rgba(251,113,133,0.1); color: var(--rose); border: 1px solid rgba(251,113,133,0.3); }
    .tag-amber { background: rgba(251,191,36,0.1); color: var(--amber); border: 1px solid rgba(251,191,36,0.3); }
    .stat-box {
      background: var(--bg-code); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.75rem; text-align: center;
    }
    .stat-box .value { font-size: 1.5rem; font-weight: 700; }
    .stat-box .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-box.cyan .value { color: var(--cyan); }
    .stat-box.emerald .value { color: var(--emerald); }
    .stat-box.rose .value { color: var(--rose); }
    .stat-box.amber .value { color: var(--amber); }
    .form-control, .form-select {
      background: var(--bg-code); border: 1px solid var(--border); color: var(--text);
      font-size: 0.85rem;
    }
    .form-control:focus, .form-select:focus {
      background: var(--bg-code); border-color: var(--cyan); color: var(--text); box-shadow: 0 0 0 0.2rem rgba(34,211,238,0.15);
    }
    .btn-primary { background: var(--cyan); border-color: var(--cyan); color: #000; font-weight: 600; font-size: 0.85rem; }
    .btn-primary:hover { background: #1bb8d8; border-color: #1bb8d8; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); font-size: 0.85rem; }
    .btn-outline:hover { border-color: var(--cyan); color: var(--cyan); }
    .chart-container { width: 100%; height: 420px; }
    .signal-entry { color: var(--emerald); }
    .signal-exit { color: var(--rose); }
    hr { border-color: var(--border); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-md">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">◈ DockerTVWebhook</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link {% if request.path.startswith('/dsl') %}active{% endif %}" href="/dsl">Indicator DSL</a></li>
        </ul>
        <span class="navbar-text" style="font-size:0.75rem;color:var(--text-dim);">
          {% block nav_extra %}{% endblock %}
        </span>
      </div>
    </div>
  </nav>
  <div class="container-fluid p-3">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
